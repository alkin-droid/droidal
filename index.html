<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALKIN DROID Fastboot Aurora</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050505;
      font-family: 'Orbitron', sans-serif;
    }

    h1 {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 9vw;
      font-weight: 900;
      text-transform: uppercase;
      background: linear-gradient(180deg, #00ffcc, #0066ff, #9900ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px #00ffcc, 0 0 80px #0066ff;
      letter-spacing: 0.5vw;
      text-align: center;
      z-index: 2;
    }

    img {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 25vw;
      max-width: 220px;
      filter: drop-shadow(0 0 35px #00ff00);
      z-index: 2;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>
  <canvas id="aurora"></canvas>
  <h1>ALKIN DROID</h1>
  <!-- Logo Android fastboot -->
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Android_robot.svg" alt="Android Fastboot">

  <script>
    const canvas = document.getElementById('aurora');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ['#00ffcc', '#0066ff', '#9900ff', '#33ff99'];
    const waves = [];

    for (let i = 0; i < 4; i++) {
      waves.push({
        y: Math.random() * canvas.height,
        amplitude: 80 + Math.random() * 50,
        wavelength: 200 + Math.random() * 200,
        speed: 0.01 + Math.random() * 0.02,
        color: colors[i],
        offset: Math.random() * Math.PI * 2
      });
    }

    function drawAurora() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      waves.forEach(wave => {
        ctx.beginPath();
        for (let x = 0; x < canvas.width; x++) {
          const y = wave.y + Math.sin(x / wave.wavelength + wave.offset) * wave.amplitude;
          ctx.lineTo(x, y);
        }
        ctx.strokeStyle = wave.color;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 25;
        ctx.shadowColor = wave.color;
        ctx.stroke();
        wave.offset += wave.speed;
      });
      requestAnimationFrame(drawAurora);
    }

    drawAurora();
  </script>
</body>
</html>
